<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wireframe responsive</title>
<style>
  :root {
    --amarillo: #f2d521;
    --morado: #8b4a94;
    --borde: #1a1a1a;
    --fondo: #f4f6f8;
    --texto: #1a1a1a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #15171a; --texto: #f1f1f1; --borde: #000; }
  }
  :root[data-theme="dark"] { --fondo: #15171a; --texto: #f1f1f1; --borde: #000; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 12px;
  }
  .pagina { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; background: #000; padding: 2px; }
  .fila { display: flex; gap: 6px; background: #000; }
  .fila > div {
    border: 2px solid var(--borde);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: .9rem; color: #111;
  }
  .a { background: var(--amarillo); flex: 0 0 var(--w); }
  .m { background: var(--morado); flex: 1 1 auto; color: #fff !important; }

  /* ===== MÓVIL (por defecto): 6 bloques ===== */
  .fila { min-height: 90px; }
  .f1 { --w: 52%; } .f2 { --w: 51%; } .f3 { --w: 52%; } .f5 { --w: 51%; }
  .f4 { flex-direction: column-reverse; }          /* morado completo y amarillo completo */
  .f4 .a { flex: 1 1 auto; }
  .f4 .m { flex: 1 1 auto; }
  .f4 > div { min-height: 90px; }
  .f4 { min-height: 0; }

  /* ===== TABLET: 768px a 1199px ===== */
  @media (min-width: 768px) {
    body { padding: 20px; }
    .pagina { max-width: 760px; }
    .fila { min-height: 100px; }
    .f4 { flex-direction: row; }
    .f4 > div { min-height: 0; }
    .f1 { --w: 25%; }
    .f2 { --w: 30%; }
    .f3 { --w: 50%; }
    .f4 { --w: 33%; }
    .f5 { --w: 28%; }
    :root { --amarillo: #1fb5a8; --morado: #e8553d; }
    .f4 .a { flex: 0 0 var(--w); }
  }

  /* ===== ESCRITORIO: 1200px en adelante ===== */
  @media (min-width: 1200px) {
    body { padding: 28px; }
    .pagina { max-width: 1440px; }
    .fila { min-height: 120px; }
    .f1 { --w: 72%; }
    .f2 { --w: 32%; }
    .f3 { --w: 72%; }
    .f4 { --w: 32%; }
    .f5 { --w: 48%; }
    :root { --amarillo: #f2d521; --morado: #8b4a94; }
  }
</style>
</head>
<body>
  <main class="pagina">
    <section class="fila f1"><div class="a"></div><div class="m"></div></section>
    <section class="fila f2"><div class="a"></div><div class="m"></div></section>
    <section class="fila f3"><div class="a"></div><div class="m"></div></section>
    <section class="fila f4"><div class="a"></div><div class="m"></div></section>
    <section class="fila f5"><div class="a"></div><div class="m"></div></section>
  </main>
</body>
</html>
